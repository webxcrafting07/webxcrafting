name: Daily SEO Auto Publisher

on:
  schedule:
    - cron: '0 0 * * *' # Runs at midnight UTC every day
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  publish-cities:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Daily Publisher Script
        run: npx tsx scripts/publish-daily-cities.ts

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add lib/citiesConfig.ts data/publish_state.json
          
          # Only commit if there are changes
          if ! git diff-index --quiet HEAD; then
            git commit -m "seo: auto-drip publish 100 new global cities [skip ci]"
            git push origin main
          else
            echo "No new cities to publish."
          fi
